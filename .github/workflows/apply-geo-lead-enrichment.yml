name: Apply Geo lead enrichment patch

on:
  push:
    branches:
      - feature/geo-lead-enrichment-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geo-lead-enrichment-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/apply_geo_enrichment_patch.py
      - name: Commit patched production files
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/app/(app)/dashboard/leads/finder/actions.ts' 'src/app/(app)/dashboard/leads/add/page.tsx' 'src/app/(app)/dashboard/leads/sources/[source]/page.tsx' 'src/lib/types.ts'
          git commit -m "Wire Geo lead enrichment into Lead Engine"
          git push origin HEAD:feature/geo-lead-enrichment-final
