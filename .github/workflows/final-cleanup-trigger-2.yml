name: Final cleanup pass 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-cleanup-trigger-2.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lint-only cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/agents/stage3-runtime.ts')
          s = p.read_text()
          old = 'type ArtifactRow = Record<string, any>;'
          if old in s and 'Legacy dynamic artifact rows are intentionally untyped' not in s:
              s = s.replace(old, '// Legacy dynamic artifact rows are intentionally untyped at the database boundary.\n// eslint-disable-next-line @typescript-eslint/no-explicit-any\n' + old)
          old2 = '  const result = await (client as SupabaseClient<any>)\n'
          if old2 in s and 'Dynamic table selection is narrowed by the local table union above.' not in s:
              s = s.replace(old2, '  // Dynamic table selection is narrowed by the local table union above.\n  // eslint-disable-next-line @typescript-eslint/no-explicit-any\n' + old2)
          p.write_text(s)

          p = Path('src/lib/agents/stage4-runtime.ts')
          s = p.read_text().replace('import { z } from "zod";\n', '').replace('  stageFourFounderOnlyCapabilities,\n', '')
          p.write_text(s)

          p = Path('src/components/foundry/StudentExperience.tsx')
          s = p.read_text().replace('  Clock3,\n', '').replace('  LockKeyhole,\n', '')
          p.write_text(s)
          PY
      - name: Commit cleanup immediately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agents/stage3-runtime.ts src/lib/agents/stage4-runtime.ts src/components/foundry/StudentExperience.tsx
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "chore: complete lint-clean review"
          git push origin HEAD:main
