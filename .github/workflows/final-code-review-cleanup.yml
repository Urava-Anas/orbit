name: Final code review cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-code-review-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/agents/stage3-runtime.ts')
          s = p.read_text()
          s = s.replace('type ArtifactRow = Record<string, any>;', 'type ArtifactRow = Record<string, unknown>;')
          s = s.replace('const result = await (client as SupabaseClient<any>)\n    .from(table)', 'const result = await client\n    .from(table)')
          p.write_text(s)

          p = Path('src/lib/agents/stage4-runtime.ts')
          s = p.read_text()
          s = s.replace('import { z } from "zod";\n', '')
          s = s.replace('  stageFourFounderOnlyCapabilities,\n', '')
          p.write_text(s)

          p = Path('src/components/foundry/StudentExperience.tsx')
          s = p.read_text()
          s = s.replace('  Clock3,\n', '')
          s = s.replace('  LockKeyhole,\n', '')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit clean review result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/agents/stage3-runtime.ts src/lib/agents/stage4-runtime.ts src/components/foundry/StudentExperience.tsx
          if git diff --cached --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git commit -m "chore: finish lint-clean code review"
          git push origin HEAD:main
