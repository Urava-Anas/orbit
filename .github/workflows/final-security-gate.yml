name: Final production security gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-security-gate.yml"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Record passing gate
        run: |
          mkdir -p docs
          printf 'Final Orbit security gate passed for %s\n' "$(git rev-parse HEAD)" > docs/.orbit-final-security-gate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.orbit-final-security-gate
          git commit -m "chore: record final security gate"
          git push origin HEAD:main
