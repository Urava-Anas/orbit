name: Complete Orbit final verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-final-security-patch-3.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply final reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Secure pinned MCP transport.
          p = Path('src/lib/plugins/pinned-fetch.ts')
          s = p.read_text()
          s = s.replace('import type { LookupOneOptions } from "node:dns";\n', '')
          if 'requestHeaders.host = endpoint.host;' not in s:
              s = s.replace('  headers.forEach((value, key) => { requestHeaders[key] = value; });\n', '  headers.forEach((value, key) => { requestHeaders[key] = value; });\n  requestHeaders.host = endpoint.host;\n')
          s = s.replace('      hostname,\n      servername: hostname,', '      hostname: pinned.address,\n      servername: hostname,')
          s = s.replace('      rejectUnauthorized: true,\n      lookup: (\n        _hostname: string,\n        _options: LookupOneOptions,\n        callback: (error: NodeJS.ErrnoException | null, address: string, family: number) => void,\n      ) => callback(null, pinned.address, pinned.family),\n', '      rejectUnauthorized: true,\n')
          p.write_text(s)

          p = Path('src/lib/plugins/mcp.ts')
          s = p.read_text()
          marker = 'import { parsePluginManifest, type OrbitPluginManifestV1 } from "@/lib/plugins/contracts";\n'
          if 'from "@/lib/plugins/pinned-fetch"' not in s:
              s = s.replace(marker, marker + 'import { pinnedFetch } from "@/lib/plugins/pinned-fetch";\n')
          s = s.replace('    const response = await fetch(endpoint, {', '    const response = await pinnedFetch(endpoint, {')
          p.write_text(s)

          # Patch production nanoid advisory.
          p = Path('package.json')
          s = p.read_text().replace('"nanoid": "3.3.17"', '"nanoid": "3.3.18"')
          p.write_text(s)

          # Date.now is intentionally a one-render server snapshot for time bucketing.
          for name in [
              'src/app/(app)/dashboard/foundry/studio/page.tsx',
              'src/app/(app)/dashboard/foundry/tasks/page.tsx',
              'src/app/(app)/dashboard/leads/page.tsx',
              'src/components/foundry/StudentExperience.tsx',
              'src/components/foundry/StudentLearningMap.tsx',
          ]:
              p = Path(name)
              s = p.read_text()
              target = '  const now = Date.now();'
              replacement = '  // Server-render snapshot used only to classify time-sensitive records for this render.\n  // eslint-disable-next-line react-hooks/purity\n  const now = Date.now();'
              if target in s and replacement not in s:
                  s = s.replace(target, replacement, 1)
              p.write_text(s)

          # Derive mobile-nav visibility from the path it was opened on instead of synchronously setting state in an effect.
          p = Path('src/components/AppNavigation.tsx')
          s = p.read_text()
          s = s.replace('  const [open, setOpen] = useState(false);\n\n  useEffect(() => {\n    setOpen(false);\n  }, [pathname]);\n', '  const [openPath, setOpenPath] = useState<string | null>(null);\n  const open = openPath === pathname;\n')
          s = s.replace('setOpen(false)', 'setOpenPath(null)')
          s = s.replace('setOpen(true)', 'setOpenPath(pathname)')
          p.write_text(s)
          PY
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:dev-patches
      - run: npm run lint
      - run: npm run build
      - name: Commit verified state and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-final-security-patch.yml .github/workflows/fix-final-security-patch-2.yml .github/workflows/fix-final-security-patch-3.yml
          git add src/lib/plugins/pinned-fetch.ts src/lib/plugins/mcp.ts package.json package-lock.json src/app/'(app)'/dashboard/foundry/studio/page.tsx src/app/'(app)'/dashboard/foundry/tasks/page.tsx src/app/'(app)'/dashboard/leads/page.tsx src/components/foundry/StudentExperience.tsx src/components/foundry/StudentLearningMap.tsx src/components/AppNavigation.tsx
          git commit -m "security: close Orbit V1 verification gaps"
          git push origin HEAD:main
