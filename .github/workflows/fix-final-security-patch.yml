name: Fix final Orbit security patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-final-security-patch.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply pinned transport fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/plugins/pinned-fetch.ts')
          s = p.read_text()
          s = s.replace('import type { LookupOneOptions } from "node:dns";\n', '')
          s = s.replace('  headers.forEach((value, key) => { requestHeaders[key] = value; });\n', '  headers.forEach((value, key) => { requestHeaders[key] = value; });\n  requestHeaders.host = endpoint.host;\n')
          s = s.replace('      hostname,\n      servername: hostname,', '      hostname: pinned.address,\n      servername: hostname,')
          s = s.replace('      rejectUnauthorized: true,\n      lookup: (\n        _hostname: string,\n        _options: LookupOneOptions,\n        callback: (error: NodeJS.ErrnoException | null, address: string, family: number) => void,\n      ) => callback(null, pinned.address, pinned.family),\n', '      rejectUnauthorized: true,\n')
          p.write_text(s)

          p = Path('src/lib/plugins/mcp.ts')
          s = p.read_text()
          marker = 'import { parsePluginManifest, type OrbitPluginManifestV1 } from "@/lib/plugins/contracts";\n'
          if 'from "@/lib/plugins/pinned-fetch"' not in s:
              s = s.replace(marker, marker + 'import { pinnedFetch } from "@/lib/plugins/pinned-fetch";\n')
          s = s.replace('    const response = await fetch(endpoint, {', '    const response = await pinnedFetch(endpoint, {')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:dev-patches
      - run: npm run lint
      - run: npm run build
      - name: Commit verified fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-final-security-patch.yml
          git add src/lib/plugins/pinned-fetch.ts src/lib/plugins/mcp.ts
          git commit -m "security: verify and deploy pinned MCP transport"
          git push origin HEAD:main
