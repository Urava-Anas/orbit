name: Fix migration replay and verify isolation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-migration-replay-and-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Fix historical fresh-replay ordering and bootstrap assumptions
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = Path('supabase/migrations/20260802193500_add_foundry_class_learning_notes.sql')
          s = notes.read_text()
          s = s.replace("check (learning_state in ('introduced', 'practising', 'understood', 'mastered'))", "check (learning_state in ('introduced', 'practising', 'understood', 'applied', 'mastered'))")
          notes.write_text(s)

          market = Path('supabase/migrations/20260813123500_orbit_plugin_marketplace_stage4.sql')
          s = market.read_text()
          owner_seed = """insert into public.orbit_platform_admins(user_id, role)\nvalues ('1603309b-da17-403f-8c2b-a8639789567d'::uuid, 'owner')\non conflict (user_id) do update set role = excluded.role;\n\n"""
          publisher_seed = """insert into public.plugin_publishers(workspace_id,slug,display_name,website,status,verified,created_by)\nselect wm.workspace_id,'urava','Urava','https://orbit-two-delta.vercel.app','active',true,wm.user_id\nfrom public.workspace_members wm\nwhere wm.user_id = '1603309b-da17-403f-8c2b-a8639789567d'::uuid and wm.role='owner'\nlimit 1\non conflict (slug) do update set verified=true,status='active',updated_at=now();\n\n"""
          s = s.replace(owner_seed, "-- Platform reviewers are bootstrapped explicitly after an authenticated user exists.\n\n")
          s = s.replace(publisher_seed, "-- First-party publishers are bootstrapped explicitly after a workspace owner exists.\n\n")
          market.write_text(s)
          PY
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector
      - name: Reset database from migrations
        run: supabase db reset --local
      - name: Run tenant-isolation test
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Commit passing replay fix and remove one-shot workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/final-tenant-isolation-verify.yml .github/workflows/fix-migration-replay-and-verify.yml
          git add supabase/migrations/20260802193500_add_foundry_class_learning_notes.sql supabase/migrations/20260813123500_orbit_plugin_marketplace_stage4.sql
          git commit -m "test: restore clean database replay and tenant isolation"
          git push origin HEAD:main
