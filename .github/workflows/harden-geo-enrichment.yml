name: Harden Geo enrichment

on:
  push:
    branches:
      - feature/geo-lead-enrichment-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/geo-lead-enrichment-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/harden_geo_enrichment.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'src/app/(app)/dashboard/leads/finder/actions.ts' 'src/app/(app)/dashboard/leads/add/page.tsx'
          git commit -m "Harden Geo enrichment contact preservation"
          git push origin HEAD:feature/geo-lead-enrichment-final
