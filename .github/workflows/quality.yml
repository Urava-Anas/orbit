name: Production Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Production engineering gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Orbit operator guard
        if: github.event_name == 'pull_request'
        env:
          ORBIT_OPERATOR_BASE_REF: origin/${{ github.base_ref }}
          ORBIT_OPERATOR_ALLOW_DELETIONS: ${{ startsWith(github.head_ref, 'release/orbit-') && '0' || '1' }}
        run: node scripts/orbit-operator.mjs guard

      - name: Audit active RC convergence target
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/orbit-')
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f config/orbit-convergence-target.json ]; then
            echo "No active RC convergence target."
            exit 0
          fi

          label="$(node -p "JSON.parse(require('fs').readFileSync('config/orbit-convergence-target.json','utf8')).label")"
          candidate="$(node -p "JSON.parse(require('fs').readFileSync('config/orbit-convergence-target.json','utf8')).candidate")"

          git fetch --no-tags origin "${candidate}"
          node scripts/rc-convergence-auditor.mjs \
            --base "origin/${{ github.base_ref }}" \
            --rc HEAD \
            --candidate "${candidate}" > /tmp/orbit-convergence.json

          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/orbit-convergence.json', 'utf8'));
          const target = JSON.parse(fs.readFileSync('config/orbit-convergence-target.json', 'utf8'));
          const lines = [
            '## RC convergence target',
            '',
            `**Target:** ${target.label}`,
            `**RC head:** \`${report.rcSha}\``,
            `**Candidate:** \`${report.candidateSha}\``,
            `**Candidate files:** ${report.candidateChangedFiles}`,
            `**Shared files:** ${report.sharedFiles.length}`,
            `**Merge conflicts:** ${report.mergeConflicts.length}`,
            `**Candidate migrations:** ${report.candidateMigrations.length}`,
            `**Duplicate migration blobs:** ${report.duplicateMigrationBlobs.length}`,
            `**Risk:** ${report.risk.toUpperCase()}`,
            `**Recommendation:** \`${report.recommendation}\``,
          ];
          if (report.sharedFiles.length) {
            lines.push('', '**Shared paths:**', ...report.sharedFiles.map((item) => `- \`${item.path}\``));
          }
          if (report.duplicateMigrationBlobs.length) {
            lines.push('', '**Duplicate migration history:**');
            for (const item of report.duplicateMigrationBlobs) {
              lines.push(`- \`${item.candidatePath}\` duplicates ${item.rcPaths.map((path) => `\`${path}\``).join(', ')}`);
            }
          }
          if (report.mergeConflicts.length) {
            lines.push('', '**True merge conflicts:**', ...report.mergeConflicts.map((path) => `- \`${path}\``));
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify patched development dependencies
        run: npm run audit:dev-patches

      - name: Start isolated Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      - name: Reset database from repository migrations
        run: supabase db reset --local

      - name: Seed isolated acceptance-test tenant
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -f supabase/ci/production_test_fixture.sql

      - name: Export isolated application environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "INTEGRATION_SECRET=ci-only-independent-integration-secret-0000000000000000000000000001"
            echo "NEXT_PUBLIC_APP_URL=https://orbit.example.test"
            echo "ORBIT_PROVIDER_CREDENTIAL_MODE=workspace"
          } >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run every database isolation and workflow suite
        shell: bash
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            if ! psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              -v ON_ERROR_STOP=1 -f "${test_file}" > /tmp/orbit-db-test.log 2>&1; then
              echo "::error file=${test_file}::Database acceptance suite failed"
              echo "---- failing test: ${test_file} ----"
              tail -n 80 /tmp/orbit-db-test.log
              exit 1
            fi
            echo "PASS ${test_file}"
          done

      - name: Unit and security-contract tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: End-to-end smoke
        run: npm run test:e2e

      - name: Scale smoke
        env:
          ORBIT_LOAD_REQUESTS: "500"
          ORBIT_LOAD_CONCURRENCY: "40"
        run: npm run test:scale

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
