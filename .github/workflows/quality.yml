name: Production Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: Lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate patched lockfile
        run: npm update minimatch brace-expansion --package-lock-only --ignore-scripts

      - name: Commit patched lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "refresh dependency security lock"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify patched development dependencies
        run: npm run audit:dev-patches

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  tenant-isolation:
    name: Database tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      - name: Reset database from migrations
        run: supabase db reset --local

      - name: Run tenant-isolation test
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/tenant_isolation.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup