<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>Regent — Urava Pulse</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--text:#f7f4ee;--muted:#aaa7b2;--gold:#deb96f;--green:#8fd5ae}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(222,185,111,.15),transparent 34%),radial-gradient(circle at 0 100%,rgba(100,87,216,.13),transparent 34%),var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input{font:inherit}.app{max-width:520px;min-height:100vh;margin:auto;padding:20px 16px 28px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.crown{width:43px;height:43px;border:1px solid rgba(222,185,111,.25);background:linear-gradient(145deg,rgba(222,185,111,.2),rgba(255,255,255,.04));border-radius:14px;display:grid;place-items:center;font-size:21px}.name{font-family:Georgia,serif;font-size:22px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.card{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 60px rgba(0,0,0,.32);backdrop-filter:blur(18px);padding:22px}.login{margin:auto 0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#f0d8a7}.title{font-size:32px;line-height:1.08;font-family:Georgia,serif;margin:11px 0}.lead{color:#d5d2da;line-height:1.6;font-size:14px}.label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:14px 0 7px}.input{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:13px 14px;outline:none}.btn{width:100%;min-height:53px;border-radius:17px;border:0;padding:13px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#e7ca88,#c79945);color:#1b150d}.secondary{background:rgba(255,255,255,.065);color:var(--text);border:1px solid var(--line)}.stack{display:grid;gap:10px}.notice{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}.danger{color:#ffc0c0}.priority{display:inline-block;font-size:10px;font-weight:900;border-radius:99px;padding:7px 10px;margin-bottom:14px;background:rgba(222,185,111,.11);color:#f0d8a7}.instruction{font-size:21px;line-height:1.38;font-weight:750;margin:9px 0 17px}.box{margin:9px 0;padding:13px 14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);border-radius:17px;line-height:1.45}.box span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.english{border-color:rgba(222,185,111,.17);background:rgba(222,185,111,.055)}.english strong{display:block;font-size:15px;margin-bottom:3px}.muted{color:var(--muted);font-size:12px}.choice{width:100%;min-height:55px;text-align:left;background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:13px 15px;font-weight:750}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px;padding:7px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:18px}.nav button{min-height:41px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.nav button.on{background:rgba(255,255,255,.08);color:var(--text)}.history{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}.value{font-family:Georgia,serif;font-size:50px}.empty{text-align:center;color:var(--muted);padding:24px 10px}.icon{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);width:42px;height:42px;border-radius:13px}.hidden{display:none!important}
</style>
</head>
<body>
<main class="app">
<div class="top"><div class="brand"><div class="crown">♛</div><div><div class="name">Regent</div><div class="sub">Urava Pulse · guided execution</div></div></div><button id="logout" class="icon hidden" type="button">↗</button></div>
<section id="screen" class="card login"><div class="eyebrow">Urava Pulse · Regent Access</div><h1 class="title">Welcome, Qurat 👑</h1><p class="lead">Enter your Regent ID and password. No email and no login link.</p><label class="label" for="loginId">Regent ID</label><input class="input" id="loginId" value="REGENT" autocomplete="username"><label class="label" for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password"><div style="height:14px"></div><button class="btn primary" id="loginButton" type="button">Open Regent</button><div id="loginMessage" class="notice"></div><div class="notice">If the app ever fails, this login card stays visible instead of a blank screen.</div></section>
<div id="nav" class="nav hidden"><button type="button" data-view="now" class="on">Now</button><button type="button" data-view="today">Today</button><button type="button" data-view="value">Urava</button></div>
</main>
<script>
(function(){'use strict';
var ENGINE='https://yaywauauqzfcmrzmbdkr.supabase.co/functions/v1/regent-engine';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InlheXdhdWF1cXpmY21yem1iZGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE4OTQ4MTQsImV4cCI6MjA3NzQ3MDgxNH0.IRA92oEpvvFBEOJaJ-w4v9XURjgg27ya9pk_xHcDb9A';
var screen=document.getElementById('screen'),nav=document.getElementById('nav'),logout=document.getElementById('logout'),token='',current=null;
try{token=localStorage.getItem('regent_session')||'';}catch(e){}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function crash(m){screen.className='card';screen.innerHTML='<div class="eyebrow danger">App problem</div><h2>Regent could not continue</h2><p class="lead">'+esc(m)+'</p><button class="btn primary" id="reload" type="button">Reload Regent</button>';var b=document.getElementById('reload');if(b)b.onclick=function(){location.reload();};}
window.onerror=function(m){crash(String(m));return false;};window.onunhandledrejection=function(e){crash(e&&e.reason?String(e.reason):'Unexpected app error');};
function api(payload,auth){var h={'content-type':'application/json','apikey':KEY};if(auth!==false&&token)h['x-regent-session']=token;return fetch(ENGINE,{method:'POST',headers:h,body:JSON.stringify(payload)}).then(function(r){return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{};}catch(e){}if(!r.ok){if(r.status===401&&auth!==false){try{localStorage.removeItem('regent_session');}catch(e){}token='';}throw new Error(j.error||('Request failed ('+r.status+')'));}return j;});});}
function logged(on){if(on){nav.classList.remove('hidden');logout.classList.remove('hidden');}else{nav.classList.add('hidden');logout.classList.add('hidden');}}
function login(msg,bad){logged(false);screen.className='card login';screen.innerHTML='<div class="eyebrow">Urava Pulse · Regent Access</div><h1 class="title">Welcome, Qurat 👑</h1><p class="lead">Enter your Regent ID and password. No email and no login link.</p><label class="label">Regent ID</label><input class="input" id="loginId" value="REGENT" autocomplete="username"><label class="label">Password</label><input class="input" id="password" type="password" autocomplete="current-password"><div style="height:14px"></div><button class="btn primary" id="loginButton" type="button">Open Regent</button><div class="notice '+(bad?'danger':'')+'">'+esc(msg||'')+'</div>';bindLogin();}
function bindLogin(){var b=document.getElementById('loginButton'),p=document.getElementById('password');if(b)b.onclick=doLogin;if(p)p.onkeydown=function(e){if(e.key==='Enter')doLogin();};}
function doLogin(){var id=document.getElementById('loginId').value.replace(/^\s+|\s+$/g,''),pw=document.getElementById('password').value;if(!id||!pw){login('Enter both your ID and password.',true);return;}screen.innerHTML='<div class="empty">Opening Regent…</div>';api({op:'login',login_id:id,password:pw},false).then(function(r){token=r.session_token||'';try{localStorage.setItem('regent_session',token);}catch(e){}logged(true);loadNext();}).catch(function(e){login(e.message,true);});}
function loadNext(){screen.className='card';screen.innerHTML='<div class="empty">Urava Pulse is preparing the next action…</div>';api({op:'next'},true).then(function(r){current=r;renderTask();}).catch(function(e){if(!token)login('Please sign in again.',true);else crash(e.message);});}
function source(a){if(a.confirm_via==='tool')return 'Tool: '+esc(a.tool_name||'guided tool');if(a.confirm_via==='human')return 'Confirm with: '+esc(a.confirm_target||'responsible person');return esc(a.confirm_target||'Urava Pulse');}
function renderTask(){logged(true);var a=current&&current.action;if(!a){screen.innerHTML='<div class="empty">No action is available right now.</div>';return;}var en=a.english_practice?'<div class="box english"><span>English for today</span><strong>'+esc(a.english_practice.phrase)+'</strong><div class="muted">'+esc(a.english_practice.meaning)+'</div></div>':'';screen.innerHTML='<div class="priority">P'+Number(a.importance==null?2:a.importance)+' · Priority</div><div class="eyebrow">Do this now</div><div class="instruction">'+esc(a.instruction)+'</div><div class="box"><span>Why this matters</span>'+esc(a.reason||'This makes the next decision clearer.')+'</div><div class="box"><span>Expected result</span>'+esc(a.expected_result||'One clear result')+'</div><div class="box"><span>Best source</span>'+source(a)+'</div>'+en+'<div class="stack" style="margin-top:16px"><button class="btn primary" id="done" type="button">Done</button><button class="btn secondary" id="problem" type="button">Problem</button><button class="btn secondary" id="confused" type="button">I don’t understand</button></div>';document.getElementById('done').onclick=results;document.getElementById('problem').onclick=problems;document.getElementById('confused').onclick=simplify;}
function results(){var a=current.action;screen.innerHTML='<div class="eyebrow">What happened?</div><h2>Choose the result</h2><div class="stack"><button class="choice" data-r="complete">✅ Complete</button><button class="choice" data-r="working">🟡 Working</button><button class="choice" data-r="blocked">🔴 Blocked</button><button class="choice" data-r="unclear">❓ Unclear</button></div>';var bs=screen.querySelectorAll('[data-r]');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){saveResult(this.getAttribute('data-r'),a);};}
function saveResult(r,a){screen.innerHTML='<div class="empty">Saving result…</div>';api({op:'result',task_id:a.id,friction_id:a.friction_id,result:r},true).then(function(z){current=z.next||null;saved('Result saved. Urava Pulse updated the history and next priority.');}).catch(function(e){crash(e.message);});}
function problems(){var o=['Work is not moving','App problem','Need an answer from someone','Something went wrong','Instruction is unclear','Something else'],h='<div class="eyebrow">Problem</div><h2>What kind of problem is it?</h2><div class="stack">';for(var i=0;i<o.length;i++)h+='<button class="choice" data-p="'+esc(o[i])+'">'+esc(o[i])+'</button>';h+='</div>';screen.innerHTML=h;var bs=screen.querySelectorAll('[data-p]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){saveProblem(this.getAttribute('data-p'));};}
function saveProblem(v){api({op:'problem',task_id:current&&current.action?current.action.id:null,actual:v},true).then(function(z){current=z.next||null;saved('Problem saved. It stays in history until the next recovery step is clear.');}).catch(function(e){crash(e.message);});}
function simplify(){api({op:'confused',task_id:current&&current.action?current.action.id:null},true).then(function(r){var s=r.simplified||{};screen.innerHTML='<div class="eyebrow">Simple guide</div><h2>Only four things</h2><div class="box"><span>Who?</span>'+esc(s.who)+'</div><div class="box"><span>What to say?</span>'+esc(s.say)+'</div><div class="box"><span>What answer to wait for?</span>'+esc(s.wait_for)+'</div><div class="box"><span>Then?</span>'+esc(s.then)+'</div><button class="btn primary" id="back" type="button">Back to task</button>';document.getElementById('back').onclick=renderTask;}).catch(function(e){crash(e.message);});}
function saved(m){screen.innerHTML='<div class="eyebrow">Saved</div><h1 class="title">Saved 👑</h1><p class="lead">'+esc(m)+'</p><button class="btn primary" id="next" type="button">See next action</button>';document.getElementById('next').onclick=function(){if(current)renderTask();else loadNext();};}
function history(){screen.innerHTML='<div class="empty">Loading history…</div>';api({op:'history'},true).then(function(r){var h=r.history||[],out='<div class="eyebrow">Today & recent</div><h2>Execution history</h2>';if(!h.length)out+='<div class="empty">History has not started yet.</div>';for(var i=0;i<h.length;i++)out+='<div class="history"><strong>'+esc((h[i].event_type||'event').replace(/_/g,' '))+'</strong><div class="muted">'+esc(h[i].actual||h[i].learning||'')+'</div><div class="muted">'+esc(h[i].validation_state||'unverified')+'</div></div>';screen.innerHTML=out;}).catch(function(e){crash(e.message);});}
function value(){screen.innerHTML='<div class="empty">Loading company value…</div>';api({op:'value'},true).then(function(r){var h=r.value_history||[];if(!h.length){screen.innerHTML='<div class="eyebrow">Urava Company Value</div><div class="empty">Verified history is still building. Urava Pulse will not invent a value score.</div>';return;}var l=h[h.length-1];screen.innerHTML='<div class="eyebrow">Urava Company Value</div><div class="value">'+Number(l.value_index||0).toFixed(0)+'</div><div class="muted">Verified Value Index / 100 · Evidence '+Number(l.verified_evidence_pct||0).toFixed(0)+'%</div>';}).catch(function(e){crash(e.message);});}
var nbs=nav.querySelectorAll('button');for(var i=0;i<nbs.length;i++)nbs[i].onclick=function(){var v=this.getAttribute('data-view');for(var j=0;j<nbs.length;j++)nbs[j].className=nbs[j].getAttribute('data-view')===v?'on':'';if(v==='today')history();else if(v==='value')value();else if(current)renderTask();else loadNext();};
logout.onclick=function(){api({op:'logout'},true).catch(function(){}).then(function(){try{localStorage.removeItem('regent_session');}catch(e){}token='';current=null;login('',false);});};
bindLogin();if(token){logged(true);loadNext();}
})();
</script>
</body>
</html>
